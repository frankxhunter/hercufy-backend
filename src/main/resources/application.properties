spring.application.name=hercufy

# Base de datos (PostgreSQL)
spring.datasource.url=${MY_DATABASE_URL}
spring.datasource.username=${MY_USER}
spring.datasource.password=${MY_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# TODO: antes de produccion, sustituir ddl-auto=update por migraciones con Flyway
# (ver plan tecnico, seccion 5). Para esta fase de desarrollo es mas agil asi.
spring.jpa.hibernate.ddl-auto=update
# El catalogo de ejercicios usa varias @ElementCollection EAGER (ver Exercise.java);
# este ajuste agrupa esas consultas en lotes al construir la cache en el arranque.
spring.jpa.properties.hibernate.default_batch_fetch_size=32
# Los servicios ya devuelven DTOs (no entidades) fuera de las transacciones, asi que
# no hace falta mantener la sesion de Hibernate abierta durante el renderizado JSON.
spring.jpa.open-in-view=false

# Seguridad / JWT
application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
application.security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# Correo (verificacion de email). Valores por defecto para poder arrancar en local
# sin SMTP configurado todavia: el envio simplemente fallara y quedara avisado en el
# log (ver EmailService), sin bloquear el registro. Sustituir por un proveedor real
# (Gmail, SendGrid, Mailtrap...) definiendo las variables de entorno correspondientes.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
application.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:4200}

# CORS
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Catalogo de ejercicios (free-exercise-db). Las imagenes no se sirven desde aqui
# todavia: se construye la URL final concatenando esta base con la ruta guardada en
# cada ejercicio. Verificar la licencia del dataset antes de publicar la aplicacion.
application.exercises.images-base-url=${EXERCISE_IMAGES_BASE_URL:https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/}
